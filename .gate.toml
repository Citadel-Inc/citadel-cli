# CI vets and runs the race tests with a per-package coverage floor; detection's plain `go test ./...` does neither.
[gates.vet]
run = "go vet ./..."

[gates.test]
run = "bash scripts/check-package-coverage.sh"
timeout = "5m"

# golangci-lint spends about a third of its CPU in GC at the default GOGC, and a cold gate is CPU-bound.
[gates.lint]
run = "GOGC=400 make lint"
