"patterns-gitleaks-00001 paths:internal/selfhost/integration_test\\.go" = ".gitleaks.toml keeps the generated-tree allowlist and adds Go test-fixture path allowlists for strings that are not live credentials"
"patterns-gitleaks-00001 paths:cmd/handler_test\\.go" = ".gitleaks.toml keeps the generated-tree allowlist and adds Go test-fixture path allowlists for strings that are not live credentials"
