title = "gitleaks config"
minVersion = "v8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Generated, vendored and build-output trees hold no authored source, and gitleaks dir reads every one of them"
paths = [
  '''(^|/)(node_modules|\.next|\.venv|\.turbo|dist|target|coverage|test-results|playwright-report)/''',
  '''^[^/]+/(.+/)?build/''',
  '''^tmp/''',
]

# Fake AdminKey / stub-admin-key strings used only as Go test fixtures; they are not live credentials.
[[allowlists]]
paths = [
  '''internal/selfhost/internal_test\.go''',
  '''internal/selfhost/config_test\.go''',
  '''internal/selfhost/integration_test\.go''',
]

# Fake CITADEL_ACCESS_TOKEN values used only as Go test fixtures; they are not live credentials.
[[allowlists]]
paths = ['''cmd/handler_test\.go''']
