name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # No contents: write in this job. It runs checkout, the build and attestation, and the
  # token that can publish a release is deliberately not in scope while any of that happens.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 brings the annotated tag OBJECT, not just the commit it points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub Release from the tag's own annotation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          body=$(git tag -l --format='%(contents:body)' "$TAG")
          [ -n "$subject" ] || subject=$(git log -1 --format='%s' "$TAG")
          [ -n "$body" ] || body=$(git log -1 --format='%b' "$TAG")
          gh release create "$TAG" \
            --title "$TAG — $subject" \
            --notes "${body:-$subject}" \
            --verify-tag

  move-major:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move the floating major tag to this release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^(v[0-9]+)\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "$TAG is not a vN.M release; no floating major to move."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          newest=$(git tag -l --sort=-v:refname "${major}.*" | grep -E "^${major}\.[0-9]+(\.[0-9]+)?$" | head -1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($newest); leaving $major where it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "$major -> $TAG" "$TAG^{commit}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin "refs/tags/$major"

  # Cross-compiled archives attach after the GitHub Release exists; this job is extra to
  # canon's checkout-only build job so those steps stay an exact match.
  package:
    needs: release
    # Workflow is tag-only; this lets act skip the cross-compile on a non-tag event.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: Rethunk-Tech/gh-actions/setup-go@346d9d280f6dfd86c9db02310039c90e2a6ddca4 # v1.31
        with:
          run-lint: "true"
          run-govulncheck: "true"

      - name: Download dependencies
        run: go mod download

      - name: Build CLI (cross-compile)
        env:
          TAG: ${{ github.ref_name }}
        run: make build-all VERSION="$TAG"

      - name: Package archives and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              tar -czf "citadel-cli_${TAG}_${os}_${arch}.tar.gz" \
                --transform "s|^citadel-cli-${os}-${arch}\$|citadel-cli|" \
                "citadel-cli-${os}-${arch}"
            done
          done
          for arch in amd64 arm64; do
            python3 -c "import zipfile; z=zipfile.ZipFile('citadel-cli_${TAG}_windows_${arch}.zip','w',zipfile.ZIP_DEFLATED); z.write('citadel-cli-windows-${arch}.exe','citadel-cli.exe')"
          done
          sha256sum citadel-cli_*.tar.gz citadel-cli_*.zip > SHA256SUMS

      - name: Upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            dist/citadel-cli_"${TAG}"_*.tar.gz \
            dist/citadel-cli_"${TAG}"_*.zip \
            dist/SHA256SUMS

  bump-homebrew-tap:
    name: Bump Homebrew tap
    needs: [release, package]
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') && (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout tap
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: Citadel-Inc/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          # Pin GitHub's published ed25519 host key; ssh-keyscan would TOFU.
          ssh-known-hosts: github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkVzJubRyZqSVymHaajC+HLx6mm7D4dYe4xWQ5N

      - name: Bump formula and push
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ env.DRY_RUN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "not a v* tag; would rewrite Formula/citadel-cli.rb version/url/sha256 and git push --dry-run origin main"
            exit 0
          fi
          mkdir -p dist
          gh release download "$TAG" --pattern SHA256SUMS --dir dist
          export TAG
          python3 <<'PY'
          import os, pathlib, re, sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          sums = {}
          for line in pathlib.Path("dist/SHA256SUMS").read_text().splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  sums[parts[1].lstrip("*")] = parts[0]

          def sha(arch: str) -> str:
              name = f"citadel-cli_{tag}_darwin_{arch}.tar.gz"
              digest = sums.get(name)
              if not digest:
                  raise SystemExit(f"missing {name} in SHA256SUMS")
              return digest

          arm_sha = sha("arm64")
          amd_sha = sha("amd64")
          formula = pathlib.Path("homebrew-tap/Formula/citadel-cli.rb")
          text = formula.read_text()
          text, n = re.subn(
              r'(?m)^(\s*version\s+")[^"]+("\s*)$',
              rf"\g<1>{version}\g<2>",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("failed to rewrite version")

          def repl_arch(src: str, arch: str, digest: str) -> str:
              url = (
                  "https://github.com/Citadel-Inc/citadel-cli/releases/download/"
                  f"{tag}/citadel-cli_{tag}_darwin_{arch}.tar.gz"
              )
              pat = (
                  rf'(url\s+")[^"]*(darwin_{arch})[^"]*'
                  r'("\s*\n\s*sha256\s+")[0-9a-fA-F]+(")'
              )
              out, count = re.subn(pat, rf"\g<1>{url}\g<3>{digest}\g<4>", src, count=1)
              if count != 1:
                  raise SystemExit(f"failed to rewrite darwin {arch} url/sha256")
              return out

          text = repl_arch(text, "arm64", arm_sha)
          text = repl_arch(text, "amd64", amd_sha)
          formula.write_text(text)
          PY
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/citadel-cli.rb
          git -C homebrew-tap diff --cached --quiet && {
            echo "Formula/citadel-cli.rb already at $TAG"
            exit 0
          }
          git -C homebrew-tap commit -m "chore(citadel-cli): ${TAG}"
          key="$RUNNER_TEMP/homebrew-tap-deploy-key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" >"$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git -C homebrew-tap push origin HEAD:main
